<svg xmlns="http://www.w3.org/2000/svg" width="800" height="220" viewBox="0 0 800 220" role="img" aria-labelledby="git-flow-title git-flow-desc">
<title id="git-flow-title">Git 변경이 원격 협업으로 이동하는 흐름</title>
<desc id="git-flow-desc">작업 트리의 파일 수정, 스테이징의 선택된 변경, 로컬 커밋의 이력 기록은 내 컴퓨터 안의 서로 다른 상태입니다. 번호순으로 git add, git commit, git push라는 세 행동을 따라 GitHub 원격 저장소로 이동합니다. PR과 CI는 원격의 협업 기능 예시이며 설정·행동·결과 확인이 별도로 필요합니다. add는 업로드가 아니고 commit은 push가 아닙니다. push는 PR·CI·배포의 성공을 증명하지 않습니다.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="m0 0 8 4-8 4z"/></marker>
</defs>
<style>
  svg { --ink:#1d2939; --muted:#475467; --line:#475467; --card:#fff; font-family:system-ui,sans-serif; }
  @media (prefers-color-scheme:dark) { svg { --ink:#f9fafb; --muted:#e4e7ec; --line:#d0d5dd; --card:#182230; } }
  rect { fill:var(--card); stroke:var(--line); stroke-width:1.5; }
  .edge { fill:none; stroke:var(--line); stroke-width:1.5; marker-end:url(#arrow); }
  marker path { fill:var(--line); }
  text { fill:var(--muted); font-size:16px; text-anchor:middle; }
  .label { fill:var(--ink); font-size:19px; font-weight:650; }
  .command { font:14px ui-monospace,monospace; }
</style>
<rect x="3" y="9" width="554" height="142" rx="10" style="fill:none"/>
<text x="81" y="36">로컬 · 내 컴퓨터</text>
<text x="704" y="36">원격</text>
<path d="M602 10v25m0 74v43" stroke="var(--line)" stroke-dasharray="5 4"/>
<path class="edge" data-from="1" data-to="2" d="M147 95h62"/>
<path class="edge" data-from="2" data-to="3" d="M345 95h62"/>
<path class="edge" data-from="3" data-to="4" d="M543 95h82"/>
<g data-node="1">
  <rect x="14" y="60" width="131" height="70" rx="8"/>
  <text x="79.5" y="90" class="label">1. 작업 트리</text>
  <text x="79.5" y="115">파일 수정</text>
</g>
<g data-node="2">
  <rect x="212" y="60" width="131" height="70" rx="8"/>
  <text x="277.5" y="90" class="label">2. 스테이징</text>
  <text x="277.5" y="115">선택된 변경</text>
</g>
<g data-node="3">
  <rect x="410" y="60" width="131" height="70" rx="8"/>
  <text x="475.5" y="90" class="label">3. 로컬 커밋</text>
  <text x="475.5" y="115">이력 기록</text>
</g>
<g data-node="4">
  <rect x="629" y="60" width="160" height="70" rx="8" stroke-dasharray="6 4"/>
  <text x="709.0" y="90" class="label">4. GitHub</text>
  <text x="709.0" y="115">원격 저장소</text>
</g>
<text x="178" y="54" class="command">git add</text>
<text x="378" y="54" class="command">git commit</text>
<text x="589" y="54" class="command">git push</text>
<text x="400" y="183">GitHub 협업 기능 예: PR·CI · 설정·행동·결과는 별도 확인</text>
<text x="400" y="209">add는 업로드가 아니고 commit은 push가 아닙니다.</text>
</svg>
