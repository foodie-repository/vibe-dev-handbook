<svg xmlns="http://www.w3.org/2000/svg" width="800" height="230" viewBox="0 0 800 230" role="img" aria-labelledby="learning-map-title learning-map-desc">
<title id="learning-map-title">바이브 개발 핸드북 학습 지도</title>
<desc id="learning-map-desc">시스템 사고, 작업 환경, 풀스택, 요구·설계, 품질·협업, 배포·운영, AI 네이티브의 일곱 단계를 번호순으로 읽습니다. 번호와 실선 화살표는 권장 학습 순서를 뜻하며, 앞 단계의 기본기가 뒤 단계의 에이전트 판단과 검증을 지탱합니다. 모든 독자의 강제 선행 조건이나 각 단계의 숙련을 증명하는 그림은 아닙니다.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="m0 0 8 4-8 4z"/></marker>
</defs>
<style>
  svg { --ink:#1d2939; --muted:#475467; --line:#475467; --card:#fff; font-family:system-ui,sans-serif; }
  @media (prefers-color-scheme:dark) { svg { --ink:#f9fafb; --muted:#e4e7ec; --line:#d0d5dd; --card:#182230; } }
  rect { fill:var(--card); stroke:var(--line); stroke-width:1.5; }
  .edge { fill:none; stroke:var(--line); stroke-width:1.5; marker-end:url(#arrow); }
  marker path { fill:var(--line); }
  text { fill:var(--muted); font-size:16px; text-anchor:middle; }
  .label { fill:var(--ink); font-size:19px; font-weight:650; }
  .command { font:15px ui-monospace,monospace; }
</style>
<path class="edge" data-from="1" data-to="2" d="M181 44h28"/>
<path class="edge" data-from="2" data-to="3" d="M385 44h28"/>
<path class="edge" data-from="3" data-to="4" d="M589 44h28"/>
<path class="edge" data-from="4" data-to="5" d="M706 81v17"/>
<path class="edge" data-from="5" data-to="6" d="M619 138h-28"/>
<path class="edge" data-from="6" data-to="7" d="M415 138h-28"/>
<g data-node="1">
  <rect x="9" y="8" width="170" height="72" rx="8"/>
  <text x="94.0" y="38" class="label">1. 시스템 사고</text>
  <text x="94.0" y="63">경계·책임</text>
</g>
<g data-node="2">
  <rect x="213" y="8" width="170" height="72" rx="8"/>
  <text x="298.0" y="38" class="label">2. 작업 환경</text>
  <text x="298.0" y="63">파일·프로세스</text>
</g>
<g data-node="3">
  <rect x="417" y="8" width="170" height="72" rx="8"/>
  <text x="502.0" y="38" class="label">3. 풀스택</text>
  <text x="502.0" y="63">요청·상태</text>
</g>
<g data-node="4">
  <rect x="621" y="8" width="170" height="72" rx="8"/>
  <text x="706.0" y="38" class="label">4. 요구·설계</text>
  <text x="706.0" y="63">스펙·결정</text>
</g>
<g data-node="5">
  <rect x="621" y="102" width="170" height="72" rx="8"/>
  <text x="706.0" y="132" class="label">5. 품질·협업</text>
  <text x="706.0" y="157">테스트·Git</text>
</g>
<g data-node="6">
  <rect x="417" y="102" width="170" height="72" rx="8"/>
  <text x="502.0" y="132" class="label">6. 배포·운영</text>
  <text x="502.0" y="157">관측·복구</text>
</g>
<g data-node="7">
  <rect x="213" y="102" width="170" height="72" rx="8"/>
  <text x="298.0" y="132" class="label">7. AI 네이티브</text>
  <text x="298.0" y="157">컨텍스트·하네스</text>
</g>
<text x="400" y="202">번호·실선: 권장 학습 순서</text>
<text x="400" y="225">앞 단계의 기본기가 뒤 단계의 에이전트 판단과 검증을 지탱합니다.</text>
</svg>
