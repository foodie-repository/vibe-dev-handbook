<svg xmlns="http://www.w3.org/2000/svg" width="480" height="864" viewBox="0 0 480 864" role="img" aria-labelledby="git-flow-title git-flow-desc">
<title id="git-flow-title">Git 변경이 원격 협업으로 이동하는 흐름</title>
<desc id="git-flow-desc">작업 트리의 파일 수정, 스테이징의 선택된 변경, 로컬 커밋의 이력 기록은 내 컴퓨터 안의 서로 다른 상태입니다. 위에서 아래로 git add, git commit, git push라는 세 행동을 따라 GitHub 원격 저장소로 이동합니다. PR과 CI는 원격의 협업 기능 예시이며 설정·행동·결과 확인이 별도로 필요합니다. add는 업로드가 아니고 commit은 push가 아닙니다. push는 PR·CI·배포의 성공을 증명하지 않습니다.</desc>
<defs>
  <marker id="git-arrow-light" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="12" refY="6" orient="auto"><path d="M0,0 L0,12 L12,6 z" fill="#344054"/></marker>
  <marker id="git-arrow-dark" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="12" refY="6" orient="auto"><path d="M0,0 L0,12 L12,6 z" fill="#d0d5dd"/></marker>
</defs>
<style>.box,.mask{fill:#fff}.box,.scope,.boundary,.rule{stroke:#344054;stroke-width:2}.scope,.boundary,.rule{fill:none}.remote,.boundary{stroke-dasharray:8 6}.main{font:700 28px system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;fill:#101828}.sub,.region{font:600 24px system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;fill:#475467}.command{font:600 24px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#344054}.arrow{stroke:#344054;stroke-width:3;fill:none;marker-end:url(#git-arrow-light)}.note{font:600 20px system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;fill:#344054}@media(prefers-color-scheme:dark){.box,.mask{fill:#182230}.box,.scope,.boundary,.rule{stroke:#d0d5dd}.main{fill:#f9fafb}.sub,.region,.command,.note{fill:#e4e7ec}.arrow{stroke:#d0d5dd;marker-end:url(#git-arrow-dark)}}</style>
<rect class="scope" data-scope="local" x="16" y="16" width="448" height="464" rx="8"/>
<text class="region" x="240" y="48" text-anchor="middle">로컬 · 내 컴퓨터</text>
<line class="boundary" x1="16" y1="560" x2="464" y2="560"/>
<rect class="mask" x="32" y="540" width="96" height="36"/>
<text class="region" x="80" y="568" text-anchor="middle">원격</text>
<path class="arrow" data-from="1" data-to="2" data-command="git add" d="M240 160 V224"/>
<path class="arrow" data-from="2" data-to="3" data-command="git commit" d="M240 312 V376"/>
<path class="arrow" data-from="3" data-to="4" data-command="git push" d="M240 464 V608"/>
<rect class="mask" x="144" y="172" width="192" height="36"/>
<text class="command" x="240" y="200" text-anchor="middle">git add</text>
<rect class="mask" x="144" y="324" width="192" height="36"/>
<text class="command" x="240" y="352" text-anchor="middle">git commit</text>
<rect class="mask" x="144" y="496" width="192" height="36"/>
<text class="command" x="240" y="524" text-anchor="middle">git push</text>
<g class="node" data-node="1" data-scope="local"><rect class="box" x="48" y="72" width="384" height="88" rx="8"/><text class="main" x="240" y="108" text-anchor="middle">1. 작업 트리</text><text class="sub" x="240" y="140" text-anchor="middle">파일 수정</text></g>
<g class="node" data-node="2" data-scope="local"><rect class="box" x="48" y="224" width="384" height="88" rx="8"/><text class="main" x="240" y="260" text-anchor="middle">2. 스테이징</text><text class="sub" x="240" y="292" text-anchor="middle">선택된 변경</text></g>
<g class="node" data-node="3" data-scope="local"><rect class="box" x="48" y="376" width="384" height="88" rx="8"/><text class="main" x="240" y="412" text-anchor="middle">3. 로컬 커밋</text><text class="sub" x="240" y="444" text-anchor="middle">이력 기록</text></g>
<g class="node" data-node="4" data-scope="remote"><rect class="box remote" x="48" y="608" width="384" height="152" rx="8"/><text class="main" x="240" y="644" text-anchor="middle">4. GitHub</text><text class="sub" x="240" y="676" text-anchor="middle">원격 저장소</text><line class="rule" x1="64" y1="692" x2="416" y2="692"/><text class="note" x="240" y="720" text-anchor="middle">협업 기능 예: PR·CI</text><text class="note" x="240" y="748" text-anchor="middle">설정·행동·결과는 별도 확인</text></g>
<line class="rule" x1="24" y1="784" x2="456" y2="784"/>
<text class="note" x="240" y="812" text-anchor="middle">add는 업로드가 아니고</text>
<text class="note" x="240" y="840" text-anchor="middle">commit은 push가 아닙니다.</text>
</svg>
