<svg xmlns="http://www.w3.org/2000/svg" width="560" height="1172" viewBox="0 0 560 1172" role="img" aria-labelledby="full-stack-title full-stack-desc">
<title id="full-stack-title">풀스택 요청과 응답 흐름</title>
<desc id="full-stack-desc">사용자와 프런트엔드, 프런트엔드와 백엔드 API가 왕복하고 백엔드에서 데이터 저장소와 필요할 때 호출하는 외부 서비스로 각각 갈라지는 다섯 책임의 연결 지도입니다. 실선은 행동·요청·조회·변경·호출, 점선은 화면 갱신·응답·결과 반환을 나타냅니다. 인증·로깅·테스트·보안·배포는 흐름 전체를 가로지르며, 이 지도는 모든 시스템의 고정 배치나 권한 집행·저장·화면 갱신 성공의 증거가 아닙니다.</desc>
<defs>
  <marker id="full-stack-arrow-light" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="12" refY="6" orient="auto"><path d="M0,0 L0,12 L12,6 z" fill="#344054"/></marker>
  <marker id="full-stack-arrow-dark" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="12" refY="6" orient="auto"><path d="M0,0 L0,12 L12,6 z" fill="#d0d5dd"/></marker>
</defs>
<style>.box{fill:#fff;stroke:#344054;stroke-width:2}.optional{stroke-dasharray:8 8}.main{font:700 28px system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;fill:#101828}.sub,.edge-label{font:600 20px system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;fill:#475467}.arrow,.legend-line{stroke:#344054;stroke-width:3;fill:none;marker-end:url(#full-stack-arrow-light)}.response{stroke-dasharray:8 8}.mask{fill:#fff}.rule{stroke:#344054;stroke-width:1}.note{font:600 20px system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;fill:#344054}@media(prefers-color-scheme:dark){.box{fill:#182230;stroke:#d0d5dd}.main{fill:#f9fafb}.sub,.edge-label,.note{fill:#e4e7ec}.arrow,.legend-line{stroke:#d0d5dd;marker-end:url(#full-stack-arrow-dark)}.mask{fill:#182230}.rule{stroke:#d0d5dd}}</style>
<path class="arrow request" data-from="U" data-to="F" d="M240 140 V212"/>
<path class="arrow response" data-from="F" data-to="U" d="M320 212 V140"/>
<path class="arrow request" data-from="F" data-to="B" d="M240 340 V436"/>
<path class="arrow response" data-from="B" data-to="F" d="M320 436 V340"/>
<path class="arrow request" data-from="B" data-to="D" d="M176 572 L112 700"/>
<path class="arrow response" data-from="D" data-to="B" d="M160 700 L224 572"/>
<path class="arrow request" data-from="B" data-to="E" d="M336 572 L400 700"/>
<path class="arrow response" data-from="E" data-to="B" d="M448 700 L384 572"/>
<g class="node" data-node="U"><rect class="box" x="72" y="24" width="416" height="112" rx="8"/><text class="main" x="280" y="60" text-anchor="middle">사용자</text><text class="sub" x="280" y="92" text-anchor="middle">브라우저·앱을 통한 행동과 입력</text></g>
<g class="node" data-node="F"><rect class="box" x="72" y="216" width="416" height="120" rx="8"/><text class="main" x="280" y="252" text-anchor="middle">프런트엔드</text><text class="sub" x="280" y="284" text-anchor="middle">화면·상태·입력 검증</text><text class="sub" x="280" y="312" text-anchor="middle">요청 구성</text></g>
<g class="node" data-node="B"><rect class="box" x="72" y="440" width="416" height="128" rx="8"/><text class="main" x="280" y="476" text-anchor="middle">백엔드/API</text><text class="sub" x="280" y="508" text-anchor="middle">업무 규칙·권한</text><text class="sub" x="280" y="536" text-anchor="middle">데이터 처리</text></g>
<g class="node" data-node="D"><rect class="box" x="24" y="704" width="244" height="160" rx="8"/><text class="main" x="144" y="748" text-anchor="middle">데이터 저장소</text><text class="sub" x="144" y="800" text-anchor="middle">DB·파일·캐시</text><text class="sub" x="144" y="832" text-anchor="middle">영속 상태·임시 사본</text></g>
<g class="node" data-node="E"><rect class="box optional" x="292" y="704" width="244" height="160" rx="8"/><text class="main" x="416" y="748" text-anchor="middle">외부 서비스</text><text class="sub" x="416" y="800" text-anchor="middle">API 연동</text><text class="sub" x="416" y="832" text-anchor="middle">필요할 때만 호출</text></g>
<rect class="mask" x="64" y="160" width="160" height="32" rx="4"/><text class="edge-label" x="144" y="184" text-anchor="middle">행동·입력</text>
<rect class="mask" x="340" y="160" width="160" height="32" rx="4"/><text class="edge-label" x="420" y="184" text-anchor="middle">화면 갱신</text>
<rect class="mask" x="64" y="372" width="160" height="32" rx="4"/><text class="edge-label" x="144" y="396" text-anchor="middle">HTTP 요청</text>
<rect class="mask" x="340" y="372" width="160" height="32" rx="4"/><text class="edge-label" x="420" y="396" text-anchor="middle">HTTP 응답</text>
<line class="rule" x1="24" y1="892" x2="536" y2="892"/>
<path class="legend-line" d="M32 928 H88"/><text class="note" x="108" y="936">실선: 행동·요청·조회·변경·호출</text>
<path class="legend-line response" d="M88 968 H32"/><text class="note" x="108" y="976">점선: 화면 갱신·응답·결과 반환</text>
<text class="note" x="280" y="1016" text-anchor="middle">요청: 사용자의 의도를 정해진 형식으로 전달</text>
<text class="note" x="280" y="1052" text-anchor="middle">응답: 결과·오류·상태를 되돌려 전달</text>
<text class="note" x="280" y="1100" text-anchor="middle">인증·로깅·테스트·보안·배포는</text>
<text class="note" x="280" y="1128" text-anchor="middle">특정 상자 하나가 아니라</text>
<text class="note" x="280" y="1156" text-anchor="middle">흐름 전체를 가로지릅니다.</text>
</svg>
