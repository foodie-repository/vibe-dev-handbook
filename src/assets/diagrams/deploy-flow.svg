<svg xmlns="http://www.w3.org/2000/svg" width="560" height="1008" viewBox="0 0 560 1008" role="img" aria-labelledby="deploy-flow-title deploy-flow-desc">
<title id="deploy-flow-title">정적 문서 사이트의 빌드·배포와 이름 조회</title>
<desc id="deploy-flow-desc">소스의 Markdown·설정이 빌드의 검증·변환을 거쳐 HTML·CSS·JS 아티팩트가 되고 호스팅에 배포됩니다. GitHub Pages는 정적 사이트 호스팅의 예입니다. 주소 연결의 도메인·DNS에서 사용자 브라우저로 향하는 점선은 연결할 대상을 찾는 이름 조회 결과이며 콘텐츠를 운반하지 않습니다. 브라우저는 이름 조회 뒤 호스팅에 요청하고 실선으로 콘텐츠 응답을 받습니다. 배포 성공과 실제 사용자 접근 가능성은 별도로 확인합니다.</desc>
<defs>
  <marker id="deploy-arrow-light" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="12" refY="6" orient="auto"><path d="M0,0 L0,12 L12,6 z" fill="#344054"/></marker>
  <marker id="deploy-arrow-dark" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="12" refY="6" orient="auto"><path d="M0,0 L0,12 L12,6 z" fill="#d0d5dd"/></marker>
  <marker id="deploy-lookup-light" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="12" refY="6" orient="auto"><path d="M0,0 L0,12 L12,6 z" fill="#2458d3"/></marker>
  <marker id="deploy-lookup-dark" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="12" refY="6" orient="auto"><path d="M0,0 L0,12 L12,6 z" fill="#8eafff"/></marker>
</defs>
<style>.box{fill:#fff;stroke:#344054;stroke-width:2}.focus{fill:#e8f0ff;stroke:#2458d3}.main{font:700 28px system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;fill:#101828}.sub{font:600 24px system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;fill:#475467}.note{font:600 20px system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;fill:#344054}.arrow{stroke:#344054;stroke-width:3;fill:none;marker-end:url(#deploy-arrow-light)}.lookup{stroke:#2458d3;stroke-width:3;stroke-dasharray:8 6;fill:none;marker-end:url(#deploy-lookup-light)}.mask{fill:#fff}.rule{stroke:#344054;stroke-width:1}@media(prefers-color-scheme:dark){.box{fill:#182230;stroke:#d0d5dd}.focus{fill:#17254d;stroke:#8eafff}.main{fill:#f9fafb}.sub,.note{fill:#e4e7ec}.arrow{stroke:#d0d5dd;marker-end:url(#deploy-arrow-dark)}.lookup{stroke:#8eafff;marker-end:url(#deploy-lookup-dark)}.mask{fill:#182230}.rule{stroke:#d0d5dd}}</style>
<path class="arrow" data-from="S" data-to="B" d="M280 116 V140"/>
<path class="arrow" data-from="B" data-to="A" d="M280 236 V260"/>
<path class="arrow" data-from="A" data-to="H" d="M280 356 V392 H144 V428"/>
<path class="arrow" data-from="H" data-to="U" d="M144 588 V716"/>
<path class="lookup" data-from="D" data-to="U" d="M416 588 V716"/>
<rect class="mask" x="180" y="376" width="64" height="32" rx="4"/><text class="note" x="212" y="400" text-anchor="middle">배포</text>
<rect class="mask" x="64" y="628" width="160" height="36" rx="4"/><text class="note" x="144" y="652" text-anchor="middle">콘텐츠 응답</text>
<rect class="mask" x="316" y="628" width="200" height="36" rx="4"/><text class="note" x="416" y="652" text-anchor="middle">이름 조회 결과</text>
<g class="node" data-node="S"><rect class="box" x="24" y="24" width="512" height="88" rx="8"/><text class="main" x="280" y="60" text-anchor="middle">소스</text><text class="sub" x="280" y="92" text-anchor="middle">Markdown·설정</text></g>
<g class="node" data-node="B"><rect class="box" x="24" y="144" width="512" height="88" rx="8"/><text class="main" x="280" y="180" text-anchor="middle">빌드</text><text class="sub" x="280" y="212" text-anchor="middle">검증·변환</text></g>
<g class="node" data-node="A"><rect class="box focus" x="24" y="264" width="512" height="88" rx="8"/><text class="main" x="280" y="300" text-anchor="middle">아티팩트</text><text class="sub" x="280" y="332" text-anchor="middle">HTML·CSS·JS</text></g>
<g class="node" data-node="H"><rect class="box" x="24" y="432" width="240" height="152" rx="8"/><text class="main" x="144" y="472" text-anchor="middle">호스팅</text><text class="sub" x="144" y="508" text-anchor="middle">GitHub Pages 예</text><text class="note" x="144" y="548" text-anchor="middle">정적 파일 제공</text></g>
<g class="node" data-node="D"><rect class="box" x="296" y="432" width="240" height="152" rx="8"/><text class="main" x="416" y="472" text-anchor="middle">주소 연결</text><text class="sub" x="416" y="508" text-anchor="middle">도메인·DNS</text><text class="note" x="416" y="548" text-anchor="middle">연결할 대상 찾기</text></g>
<g class="node" data-node="U"><rect class="box focus" x="24" y="720" width="512" height="112" rx="8"/><text class="main" x="280" y="756" text-anchor="middle">사용자</text><text class="sub" x="280" y="784" text-anchor="middle">브라우저</text><text class="note" x="280" y="816" text-anchor="middle">이름 조회 뒤 호스팅에 요청</text></g>
<line class="rule" x1="24" y1="856" x2="536" y2="856"/>
<text class="note" x="280" y="884" text-anchor="middle">실선: 소스 변환·콘텐츠 전달</text>
<text class="note" x="280" y="916" text-anchor="middle">점선: 이름 조회 결과 (콘텐츠 아님)</text>
<text class="note" x="280" y="956" text-anchor="middle">배포 성공과 실제 사용자 접근 가능성은</text>
<text class="note" x="280" y="984" text-anchor="middle">별도로 확인합니다.</text>
</svg>
