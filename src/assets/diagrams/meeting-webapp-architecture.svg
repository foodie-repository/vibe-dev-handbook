<svg xmlns="http://www.w3.org/2000/svg" width="560" height="952" viewBox="0 0 560 952" role="img" aria-labelledby="meeting-webapp-title meeting-webapp-desc">
<title id="meeting-webapp-title">모임 일정·참가 신청 웹앱의 책임 지도</title>
<desc id="meeting-webapp-desc">방문자·참가자·주최자의 행동이 목록·상세·참가·주최자 관리 웹 화면을 거쳐 요청 계약·인증·인가·업무 규칙을 집행하는 애플리케이션 경계에 도달합니다. 애플리케이션은 웹 화면 및 users·events·registrations를 보존하는 관계형 데이터베이스와 왕복하고, 안전한 로그·백업·복원·공개 흐름을 확인하는 운영 증거로 별도 연결됩니다. UI는 권한의 최종 경계가 아니며 인증·인가와 정원·중복·상태 판단은 신뢰할 수 있는 애플리케이션·데이터 경계에서 다시 확인합니다.</desc>
<defs>
  <marker id="meeting-arrow-light" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="12" refY="6" orient="auto"><path d="M0,0 L0,12 L12,6 z" fill="#344054"/></marker>
  <marker id="meeting-arrow-dark" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="12" refY="6" orient="auto"><path d="M0,0 L0,12 L12,6 z" fill="#d0d5dd"/></marker>
</defs>
<style>.box{fill:#fff;stroke:#344054;stroke-width:2}.application{fill:#eff8ff;stroke:#175cd3}.main{font:700 28px system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;fill:#101828}.sub{font:600 20px system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;fill:#475467}.arrow{stroke:#344054;stroke-width:3;fill:none;marker-end:url(#meeting-arrow-light)}.note{font:600 20px system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;fill:#344054}@media(prefers-color-scheme:dark){.box{fill:#182230;stroke:#d0d5dd}.application{fill:#102a56;stroke:#84adff}.main{fill:#f9fafb}.sub,.note{fill:#e4e7ec}.arrow{stroke:#d0d5dd;marker-end:url(#meeting-arrow-dark)}}</style>
<path class="arrow" data-from="U" data-to="UI" d="M280 100 V140"/>
<path class="arrow" data-from="UI" data-to="API" d="M256 244 V308"/>
<path class="arrow" data-from="API" data-to="DB" d="M200 440 L132 500"/>
<path class="arrow" data-from="API" data-to="OP" d="M384 440 L416 500"/>
<path class="arrow" data-from="DB" data-to="API" d="M164 500 L232 440"/>
<path class="arrow" data-from="API" data-to="UI" d="M304 308 V244"/>
<g class="node" data-node="U">
  <rect class="box" x="72" y="24" width="416" height="72" rx="8"/>
  <text class="main" x="280" y="68" text-anchor="middle">방문자·참가자·주최자</text>
</g>
<g class="node" data-node="UI">
  <rect class="box" x="72" y="144" width="416" height="96" rx="8"/>
  <text class="main" x="280" y="184" text-anchor="middle">웹 화면</text>
  <text class="sub" x="280" y="216" text-anchor="middle">목록·상세·참가·주최자 관리</text>
</g>
<g class="node" data-node="API">
  <rect class="box application" x="72" y="312" width="416" height="124" rx="8"/>
  <text class="main" x="280" y="356" text-anchor="middle">애플리케이션 경계</text>
  <text class="sub" x="280" y="396" text-anchor="middle">요청 계약·인증·인가·업무 규칙</text>
</g>
<g class="node" data-node="DB">
  <rect class="box" x="24" y="504" width="244" height="184" rx="8"/>
  <text class="main" x="148" y="544" text-anchor="middle">관계형</text>
  <text class="main" x="148" y="580" text-anchor="middle">데이터베이스</text>
  <text class="sub" x="148" y="620" text-anchor="middle">users·events·</text>
  <text class="sub" x="148" y="652" text-anchor="middle">registrations</text>
</g>
<g class="node" data-node="OP">
  <rect class="box" x="292" y="504" width="244" height="184" rx="8"/>
  <text class="main" x="416" y="560" text-anchor="middle">운영 증거</text>
  <text class="sub" x="416" y="608" text-anchor="middle">안전한 로그·백업·</text>
  <text class="sub" x="416" y="640" text-anchor="middle">복원·공개 흐름</text>
</g>
<text class="note" x="280" y="736" text-anchor="middle">UI는 권한의 최종 경계가 아닙니다.</text>
<text class="note" x="280" y="764" text-anchor="middle">인증·인가와 정원·중복·상태 판단은</text>
<text class="note" x="280" y="792" text-anchor="middle">애플리케이션·데이터 경계에서</text>
<text class="note" x="280" y="820" text-anchor="middle">다시 확인합니다.</text>
<text class="note" x="280" y="868" text-anchor="middle">이 지도는 책임을 보여 주며,</text>
<text class="note" x="280" y="896" text-anchor="middle">특정 프레임워크나 서비스 제품을</text>
<text class="note" x="280" y="924" text-anchor="middle">정답으로 정하지 않습니다.</text>
</svg>
