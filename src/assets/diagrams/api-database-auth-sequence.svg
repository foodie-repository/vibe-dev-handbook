<svg xmlns="http://www.w3.org/2000/svg" width="688" height="960" viewBox="0 0 688 960" role="img" aria-labelledby="api-database-auth-sequence-title api-database-auth-sequence-desc">
<title id="api-database-auth-sequence-title">마지막 한 자리 동시 요청과 commit 뒤 응답 유실 복구</title>
<desc id="api-database-auth-sequence-desc">참가자 A와 B가 분리된 lifeline에서 마지막 한 자리에 동시에 요청하면 참가 서비스와 데이터베이스가 중복, 모집 상태, 정원을 트랜잭션 확정 경계에서 다시 검사해 A 한 건만 commit하고 B는 변경 없이 거절합니다. A의 성공 응답이 commit 뒤 유실되면 생성 요청을 즉시 반복하지 않고 권한 있는 현재 상태, 이벤트, 처리 기록을 재조회해 이미 확정된 결과와 confirmed가 capacity 이하이고 활성 중복과 부분 저장이 없다는 불변식을 확인합니다.</desc>
<defs>
  <marker id="api-sequence-arrow-light" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#344054"/></marker>
  <marker id="api-sequence-arrow-dark" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#d0d5dd"/></marker>
  <marker id="api-sequence-commit-light" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#067647"/></marker>
  <marker id="api-sequence-commit-dark" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#75e0a7"/></marker>
</defs>
<style>.actor{fill:#fff;stroke:#344054;stroke-width:2}.actor-label{font:700 24px system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;fill:#101828}.parallel-frame{fill:none;stroke:#175cd3;stroke-width:2;stroke-dasharray:8 6}.parallel-tag{font:700 16px system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;fill:#175cd3}.lifeline{stroke:#98a2b3;stroke-width:2;stroke-dasharray:6 6}.activation{fill:#f2f4f7;stroke:#667085;stroke-width:1}.message-line{fill:none;stroke:#344054;stroke-width:2.5;marker-end:url(#api-sequence-arrow-light)}.return-line{stroke-dasharray:8 6}.commit-line{stroke:#067647;marker-end:url(#api-sequence-commit-light)}.loss-line{fill:none;stroke:#c4320a;stroke-width:3;stroke-dasharray:8 6}.loss-x{stroke:#c4320a;stroke-width:4}.label-mask{fill:#fff}.message-label{font:700 24px system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;fill:#101828}.message-detail{font:600 20px system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;fill:#475467}.commit-text{fill:#067647}.loss-text{fill:#b42318}@media(prefers-color-scheme:dark){.actor{fill:#182230;stroke:#d0d5dd}.actor-label,.message-label{fill:#f9fafb}.parallel-frame{stroke:#84adff}.parallel-tag{fill:#84adff}.lifeline{stroke:#98a2b3}.activation{fill:#344054;stroke:#d0d5dd}.message-line{stroke:#d0d5dd;marker-end:url(#api-sequence-arrow-dark)}.commit-line{stroke:#75e0a7;marker-end:url(#api-sequence-commit-dark)}.loss-line,.loss-x{stroke:#fda29b}.label-mask{fill:#101828}.message-detail{fill:#d0d5dd}.commit-text{fill:#75e0a7}.loss-text{fill:#fda29b}}</style>
<rect class="parallel-frame" data-parallel="1" x="32" y="104" width="392" height="120" rx="8"/>
<text class="parallel-tag" x="44" y="124">PAR · 동시 시작</text>
<line class="lifeline" x1="64" y1="84" x2="64" y2="936"/>
<line class="lifeline" x1="208" y1="84" x2="208" y2="936"/>
<line class="lifeline" x1="408" y1="84" x2="408" y2="936"/>
<line class="lifeline" x1="608" y1="84" x2="608" y2="936"/>
<rect class="activation" x="404" y="144" width="8" height="720"/>
<rect class="activation" x="604" y="276" width="8" height="528"/>
