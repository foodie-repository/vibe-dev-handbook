<g class="message" data-unit="1"><rect class="label-mask" x="160" y="128" width="208" height="28" rx="4"/><text class="message-label" x="264" y="152" text-anchor="middle">1. A 참가 요청</text></g>
<g class="message" data-unit="2"><rect class="label-mask" x="232" y="176" width="168" height="28" rx="4"/><text class="message-label" x="316" y="200" text-anchor="middle">2. B 참가 요청</text></g>
<g class="message" data-unit="3"><rect class="label-mask" x="376" y="232" width="264" height="48" rx="4"/><text class="message-label" x="508" y="254" text-anchor="middle">3. 확정 전 재검사</text><text class="message-detail" x="508" y="276" text-anchor="middle">중복·open·정원</text></g>
<g class="message" data-unit="4"><rect class="label-mask" x="400" y="292" width="280" height="52" rx="4"/><text class="message-label" x="540" y="316" text-anchor="middle">4. 트랜잭션 확정 경계</text><text class="message-detail" x="540" y="338" text-anchor="middle">동시성 전략으로 1건 확정</text></g>
<g class="message" data-unit="5"><rect class="label-mask" x="356" y="384" width="304" height="48" rx="4"/><text class="message-label commit-text" x="508" y="406" text-anchor="middle">5. A만 commit·처리 기록</text><text class="message-detail commit-text" x="508" y="428" text-anchor="middle">B 변경 없음</text></g>
<g class="message" data-unit="6"><rect class="label-mask" x="112" y="456" width="288" height="50" rx="4"/><text class="message-label loss-text" x="256" y="479" text-anchor="middle">6. commit 뒤 응답 유실</text><text class="message-detail loss-text" x="256" y="502" text-anchor="middle">A 성공 응답 미도착</text></g>
<g class="message" data-unit="7"><rect class="label-mask" x="184" y="536" width="240" height="32" rx="4"/><text class="message-label" x="304" y="562" text-anchor="middle">7. B 충돌·정원 응답</text></g>
<g class="message" data-unit="8"><rect class="label-mask" x="68" y="588" width="356" height="52" rx="4"/><text class="message-label" x="246" y="612" text-anchor="middle">8. A가 현재 상태 재조회</text><text class="message-detail" x="246" y="634" text-anchor="middle">즉시 생성 요청 반복 금지</text></g>
<g class="message" data-unit="9"><rect class="label-mask" x="364" y="660" width="288" height="52" rx="4"/><text class="message-label" x="508" y="684" text-anchor="middle">9. 참가·이벤트 조회</text><text class="message-detail" x="508" y="706" text-anchor="middle">처리 기록 함께 확인</text></g>
<g class="message" data-unit="10"><rect class="label-mask" x="348" y="732" width="320" height="52" rx="4"/><text class="message-label commit-text" x="508" y="756" text-anchor="middle">10. A 확정·인원≤정원</text><text class="message-detail commit-text" x="508" y="778" text-anchor="middle">활성 중복·부분 저장 0</text></g>
<g class="message" data-unit="11"><rect class="label-mask" x="68" y="804" width="356" height="52" rx="4"/><text class="message-label" x="246" y="828" text-anchor="middle">11. 이미 확정</text><text class="message-detail" x="246" y="850" text-anchor="middle">중복 생성 요청 불필요</text></g>
<rect class="actor" x="8" y="24" width="112" height="60" rx="12"/><text class="actor-label" x="64" y="61" text-anchor="middle">참가자 A</text>
<rect class="actor" x="152" y="24" width="112" height="60" rx="12"/><text class="actor-label" x="208" y="61" text-anchor="middle">참가자 B</text>
<rect class="actor" x="336" y="24" width="144" height="60" rx="12"/><text class="actor-label" x="408" y="61" text-anchor="middle">참가 서비스</text>
<rect class="actor" x="536" y="24" width="144" height="60" rx="12"/><text class="actor-label" x="608" y="61" text-anchor="middle">데이터베이스</text>
</svg>
