<svg xmlns="http://www.w3.org/2000/svg" width="560" height="1108" viewBox="0 0 560 1108" role="img" aria-labelledby="analytics-dashboard-title analytics-dashboard-desc">
<title id="analytics-dashboard-title">교육용 주가 데이터 대시보드의 책임과 증거 흐름</title>
<desc id="analytics-dashboard-desc">교육용 가상 fixture 또는 승인된 공식 원천에서 정의와 시간대와 이용 조건을 확인하고, 상품과 거래 기준을 정규화한 뒤 품질 게이트, 분석 저장소, 버전이 있는 전달 계약, 대시보드 UI, 정정과 복원의 사용자·운영 증거까지 이어지는 일곱 단계 흐름입니다. 점선 피드백은 정정과 복원 증거가 원인이 있는 앞 단계로 돌아감을 나타냅니다.</desc>
<defs>
  <marker id="analytics-arrow-light" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#344054"/></marker>
  <marker id="analytics-arrow-dark" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#d0d5dd"/></marker>
  <marker id="analytics-feedback-light" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#067647"/></marker>
  <marker id="analytics-feedback-dark" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#75e0a7"/></marker>
</defs>
<style>.box{fill:#fff;stroke:#344054;stroke-width:2}.source{fill:#eff8ff;stroke:#175cd3}.quality{fill:#fffaeb;stroke:#b54708}.delivery{fill:#f9f5ff;stroke:#6941c6}.evidence{fill:#ecfdf3;stroke:#067647}.label{font:700 23px system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;fill:#101828}.detail{font:600 18px system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;fill:#475467}.arrow{stroke:#344054;stroke-width:3;fill:none;marker-end:url(#analytics-arrow-light)}.feedback{stroke:#067647;stroke-width:3;stroke-dasharray:8 7;fill:none;marker-end:url(#analytics-feedback-light)}.feedback-label{font:700 17px system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;fill:#067647}.note{font:600 17px system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;fill:#475467}@media(prefers-color-scheme:dark){.box{fill:#182230;stroke:#d0d5dd}.source{fill:#102a56;stroke:#84adff}.quality{fill:#3b2a12;stroke:#fec84b}.delivery{fill:#2b1d3a;stroke:#b692f6}.evidence{fill:#053321;stroke:#75e0a7}.label{fill:#f9fafb}.detail,.note{fill:#e4e7ec}.arrow{stroke:#d0d5dd;marker-end:url(#analytics-arrow-dark)}.feedback{stroke:#75e0a7;marker-end:url(#analytics-feedback-dark)}.feedback-label{fill:#75e0a7}}</style>
<path class="arrow" d="M280 128 V158"/>
<path class="arrow" d="M280 264 V294"/>
<path class="arrow" d="M280 400 V430"/>
<path class="arrow" d="M280 536 V566"/>
<path class="arrow" d="M280 672 V702"/>
<path class="arrow" d="M280 808 V838"/>
<path class="feedback" data-feedback="1" d="M56 894 H22 V78 H48"/>
<g class="node" data-node="1"><rect class="box source" x="56" y="28" width="448" height="100" rx="16"/><text class="label" x="280" y="63" text-anchor="middle">1. 원천·권리</text><text class="detail" x="280" y="91" text-anchor="middle">fixture 또는 승인된 공식 원천</text><text class="detail" x="280" y="114" text-anchor="middle">정의·시간대·이용 조건</text></g>
<g class="node" data-node="2"><rect class="box" x="56" y="164" width="448" height="100" rx="16"/><text class="label" x="280" y="199" text-anchor="middle">2. 수집·정규화</text><text class="detail" x="280" y="227" text-anchor="middle">상품 ID·거래일·시장</text><text class="detail" x="280" y="250" text-anchor="middle">통화·가격 기준·원천 버전</text></g>
<g class="node" data-node="3"><rect class="box quality" x="56" y="300" width="448" height="100" rx="16"/><text class="label" x="280" y="335" text-anchor="middle">3. 품질 게이트</text><text class="detail" x="280" y="363" text-anchor="middle">중복·결측·단위·거래일</text><text class="detail" x="280" y="386" text-anchor="middle">조정 상태·게시 판정</text></g>
<g class="node" data-node="4"><rect class="box" x="56" y="436" width="448" height="100" rx="16"/><text class="label" x="280" y="471" text-anchor="middle">4. 분석 저장소</text><text class="detail" x="280" y="499" text-anchor="middle">가격·거래량·값 상태</text><text class="detail" x="280" y="522" text-anchor="middle">lineage·dataset_version</text></g>
<g class="node" data-node="5"><rect class="box delivery" x="56" y="572" width="448" height="100" rx="16"/><text class="label" x="280" y="607" text-anchor="middle">5. 전달 계약</text><text class="detail" x="280" y="635" text-anchor="middle">정적 파일 또는 읽기 전용 API</text><text class="detail" x="280" y="658" text-anchor="middle">버전·오류·호환성</text></g>
<g class="node" data-node="6"><rect class="box" x="56" y="708" width="448" height="100" rx="16"/><text class="label" x="280" y="743" text-anchor="middle">6. 대시보드 UI</text><text class="detail" x="280" y="771" text-anchor="middle">상품·기간·표·차트</text><text class="detail" x="280" y="794" text-anchor="middle">단위·기준 시점·품질 상태</text></g>
<g class="node" data-node="7"><rect class="box evidence" x="56" y="844" width="448" height="100" rx="16"/><text class="label" x="280" y="879" text-anchor="middle">7. 사용자·운영 증거</text><text class="detail" x="280" y="907" text-anchor="middle">fixture 표시·갱신 감지</text><text class="detail" x="280" y="930" text-anchor="middle">정정·복원·공개 흐름</text></g>
<text class="feedback-label" x="280" y="988" text-anchor="middle">점선 피드백 · 정정·복원 증거는</text>
<text class="feedback-label" x="280" y="1012" text-anchor="middle">원인이 있는 단계로 돌아갑니다.</text>
<text class="note" x="280" y="1052" text-anchor="middle">화면 성공만으로 데이터 의미와 이용 권리가</text>
<text class="note" x="280" y="1076" text-anchor="middle">증명되지는 않습니다.</text>
</svg>
