name: 콘텐츠 오류 제보
description: 오탈자, 이해하기 어려운 설명, 잘못된 링크를 알려주세요.
title: "[콘텐츠] "
body:
  - type: markdown
    attributes:
      value: "이 양식은 공개 Issue로 제출됩니다. 개인정보·회사 자료·토큰·비밀번호와 보안 취약점의 세부 내용은 넣지 마세요. 첨부 이미지·로그·URL의 쿼리에도 비밀이 없는지 확인해 주세요. 보안 문제는 저장소의 SECURITY.md를 먼저 읽어주세요."
  - type: input
    id: page
    attributes:
      label: 페이지 URL 또는 저장소 상대 경로
      description: 공개된 페이지 주소나 문서 경로와 제목을 알려주세요. 개인 로컬 경로와 비공개 URL은 제외해 주세요.
      placeholder: src/content/docs/start-here/how-to-use-this-guide.md
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 문제가 있는 문장 또는 위치
      description: 제목·절 이름과 문제가 되는 짧은 부분을 적어주세요. 문서 전체나 외부 유료 원문을 붙여넣지 마세요.
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: 독자에게 어떤 어려움이 있었나요?
      description: 헷갈린 의미, 잘못 이해할 가능성 또는 이동하지 못한 링크를 설명해 주세요.
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: 수정 제안
      description: 더 이해하기 쉬운 표현이나 기대하는 동작이 있으면 알려주세요. 해결책이 없어도 제보하실 수 있습니다.
    validations:
      required: false
  - type: textarea
    id: sources
    attributes:
      label: 참고할 출처
      description: 관련 공식·1차 자료의 공개 URL과 확인일, 어느 부분을 뒷받침하는지 적어주세요.
    validations:
      required: false
  - type: checkboxes
    id: safety
    attributes:
      label: 공개 전 확인
      options:
        - label: 본문·URL·첨부물에 개인정보, 회사 내부 자료, API 키·토큰·비밀번호 등 비밀정보를 넣지 않았습니다.
          required: true
        - label: 보안 취약점의 세부 제보가 아니며, 보안 문제라면 공개 Issue 대신 SECURITY.md의 비공개 제보 경로를 확인하겠습니다.
          required: true
